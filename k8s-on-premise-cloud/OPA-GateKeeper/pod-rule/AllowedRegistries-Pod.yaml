apiVersion: apps/v1
kind: Deployment
metadata:
  name: allowed-registries-deployment
  namespace: movie-web
  labels:
    app: allowed-registries
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: allowed-registries
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: allowed-registries
    spec:
      containers:
        - name: allowed-registries
          image: nginx:latest
          ports:
            - containerPort: 3002
              protocol: TCP  
              name: tcp
          resources:
            requests:
              memory: "256Mi"
      imagePullSecrets:
        - name: auth-registry
      dnsPolicy: ClusterFirst
      restartPolicy: Always

