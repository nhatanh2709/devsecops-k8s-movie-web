apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-allowed-repos-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://gitlab.com/movie-web3/movie-web-backend-bill-service.git'
    targetRevision: main
    path: ./
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true