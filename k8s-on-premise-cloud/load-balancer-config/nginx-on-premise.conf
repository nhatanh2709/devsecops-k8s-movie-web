load_module modules/ngx_http_geoip2_module.so;

events {
    worker_connections 1024;
}

http {
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
        $geoip_code_country country iso_code;
    }

    log_format custom '$remote_addr - $remote_user [$time_local] '
              '"$request" $status $body_bytes_sent '
              '"$http_referer" "UA: $http_user_agent" '
              '"$http_x_forwarded_for" '
              'Country: $geoip_code_country';

    server {
        server_name web.nhatanhmovie.website;
        location / {
            proxy_pass http://my_serverss;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Country-Code $geoip_code_country;
            proxy_set_header X-Traffic-ID "aws-movie-web-traffic";
            proxy_set_header User-Agent $http_user_agent;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/web.nhatanhmovie.website/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/web.nhatanhmovie.website/privkey.pem;
    }

    server {
        listen 80;
        server_name web.nhatanhmovie.website;
        if ($host = web.nhatanhmovie.website) {
            return 301 https://$host$request_uri;
        }
        return 404;
    }
}