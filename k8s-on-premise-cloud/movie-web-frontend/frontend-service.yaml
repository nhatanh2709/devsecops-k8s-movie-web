
apiVersion: v1
kind: Service
metadata:
  name: movie-web-frontend-service 
  namespace: movie-web
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  type: ClusterIP
  selector:
    app: movie-web-frontend 
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: tcp
