kind: AnalysisTemplate
apiVersion: argoproj.io/v1alpha1
metadata:
  name: fail
  namespace: test-rollouts
spec:
  metrics:
    - name: fail
      count: 1
      interval: 5s
      failureLimit: 1
      provider:
        job:
          spec:
            template:
              spec:
                containers:
                  - name: sleep
                    image: alpine:3.8
                    command: [sh, -c]
                    args: [exit 1]
                restartPolicy: Never
            backoffLimit: 0