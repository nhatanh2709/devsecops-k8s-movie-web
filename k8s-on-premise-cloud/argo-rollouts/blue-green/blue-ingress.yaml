apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bluegreen-demo
  namespace: test-rollouts
spec:
  ingressClassName: nginx
  rules:
  - host: argo-blue.nhatanhmovieweb.shop
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bluegreen-demo
            port:
              name: http