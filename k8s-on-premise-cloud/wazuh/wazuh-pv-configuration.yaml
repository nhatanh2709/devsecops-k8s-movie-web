apiVersion: v1 
kind: PersistentVolume
metadata:
  name: wazuh-indexer-pv-1
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  nfs:
    path: /data/wazuh/indexer-1
    server: 192.168.1.114
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage
---
