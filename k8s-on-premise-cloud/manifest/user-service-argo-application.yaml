apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-service-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://gitlab.com/movie-web-manifest/movie-web-backend-user-service.git'
    targetRevision: main
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true