apiVersion: v1
kind: PersistentVolume
metadata:
  name: elasticsearch-pv
  namespace: movie-web
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  nfs:
    path: /data/movie-web/elasticsearch
    server: 192.168.1.114
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage
