apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sContainerEphemeralStorageLimit
metadata:
  name: enforce-ephemeral-storage-limit  
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps", "extensions"]
        kinds: ["Deployment", "ReplicaSet", "DaemonSet", "StatefulSet"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["test", "movie-web-blue-green"]
  parameters:
    ephemeral-storage: "2Gi" 
    exemptImages: 
      - "istio/*"
      - "docker.io/istio/*"
      - "*.istio.io/*"
      - "service.istio.io/*"
      - "proxyv2"
  validationFailureAction: enforce
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sContainerLimits
metadata:
  name: container-limit-rule
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps", "extensions"]
        kinds: ["Deployment", "ReplicaSet", "DaemonSet", "StatefulSet"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["test", "movie-web-blue-green"]
  parameters:
    cpu: "2000m"
    memory: "2Gi"
    exemptImages: 
      - "istio/*"
      - "docker.io/istio/*"
      - "*.istio.io/*"
      - "service.istio.io/*"
      - "proxyv2"
  validationFailureAction: enforce
---
apiVersion: constraints.gatekeeper.sh/v1beta1
