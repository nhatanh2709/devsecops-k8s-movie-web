apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-limit-deployment
  namespace: test
  labels:
    app: container-limit
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: container-limit
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: container-limit
    spec:
      containers:
        - name: container-limit
          image: nginx:latest
          ports:
            - containerPort: 3002
              protocol: TCP
              name: tcp
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1024Mi"    
              cpu: "1000m"     
      dnsPolicy: ClusterFirst
      restartPolicy: Always