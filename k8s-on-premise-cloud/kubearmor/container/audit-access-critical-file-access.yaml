apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: audit-access-container-critical-file-access
  namespace: test
spec:
  severity: 10
  message: "Alert! Audit access to critical files in container"
  tags:
  - WARNING
  selector:
    matchLabels:
      app: ubuntu  
  process:
    matchDirectories:
    - dir: /bin/ 
      recursive: true
    - dir: /usr/bin/ 
      recursive: true
  file:
    matchPaths:
    - path: /credentials/password
      readOnly: true
    - path: /root/.bashrc 
    - path: /root/.bash_history 
    - path: /dev/tty
    matchDirectories:
    - dir: /etc/ 
      recursive: true
    - dir: /proc/ 
      recursive: true
  action:
    Audit