apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: nginx-audit-configuration-blocked
  namespace: test
spec:
  message: " Alert! unauthorized modification in home directory "
  tags: 
  - NOTICE
  selector:
    matchLabels:
      app: nginx
  file:
    severity: 4
    matchDirectories:
    - dir: /etc/nginx/
      ownerOnly: true
      recursive: true
    - dir: /root/
      ownerOnly: true
      recursive: true
    action: Audit