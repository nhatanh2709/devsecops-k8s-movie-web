apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubuntu-template-deployment
  namespace: test
  labels:
    app: ubuntu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ubuntu
  template:
    metadata:
      labels:
        app: ubuntu
    spec:
      containers:
      - name: ubuntu
        image: ubuntu:22.04
        command: ["/bin/bash"]
        args: ["-c", "apt-get update && apt-get install iputils-ping netcat nmap dsniff net-tools -y && sleep infinity"]
        ports:
        - containerPort: 22
        resources:
          requests:
            memory: "256Mi"
          limits:
            memory: "512Mi"  