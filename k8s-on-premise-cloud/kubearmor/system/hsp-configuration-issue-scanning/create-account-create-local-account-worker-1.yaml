apiVersion: security.kubearmor.com/v1
kind: KubeArmorHostPolicy
metadata:
  name: alert-create-account-create-local-account-worker-1
spec:
  nodeSelector: 
    matchLabels:
      kubernetes.io/hostname: k8s-worker-1
  message: "Notification! User and password added/modified"
  file:
    severity: 5
    matchPaths:
    - path: /etc/passwd
    - path: /etc/shadow
    action: Block
  process:
    severity: 5
    matchPaths:
    - path: /bin/useradd
    - path: /bin/adduser
    action: Audit